version: 1
entries:
  - term: 憲法的
    policy: forbid
    message: 直訳的な造語として使わず，規則，前提，方針などの具体的な関係を説明する．
  - term: 正本
    policy: review
    message: 法律上の正本を指す場合を除き，基準，原本，元データ，または管理方法を具体的に述べる．
  - term: 憲法
    policy: review
    message: 法制度としての憲法を指す場合に限る．単なる基本規則の比喩として使わない．
  - term: 契約
    policy: review
    message: 法律用語としての契約に限る．単なる約束や取り決めの意味で使わない．
  - term: 哲学
    policy: review
    message: 哲学上の議論を指しているか確認し，単なる方針または考え方の意味で安易に使わない．
  - term: 台帳
    policy: review
    message: 実際の記録簿または管理表を指しているか確認する．
  - term: 不可欠
    policy: review
    message: 必要性を具体的に説明できる場合に限る．
  - term: 核心的
    policy: review
    message: 何に対して重要であるかを具体的に説明する．
  - term: 正面から
    policy: review
    message: 比喩的な強調であれば，扱う，検討する，対応するなどの具体的な動詞にする．
  - term: 革命的
    policy: forbid
    message: 比較可能な変化を具体的に記述する．
  - term: ゲームチェンジャー
    policy: forbid
    message: 何がどのように変化するかを具体的に記述する．
  - term: 可能性を解き放つ
    policy: forbid
    message: 実現する機能または効果を具体的に記述する．
  - term: 魔法のように
    policy: forbid
    message: 動作または処理を具体的に記述する．
  - term: 究極
    policy: forbid
    message: 比較基準がない強調として使わない．
